name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 18.18.0
          - os: ubuntu-latest
            node: 22.x
          - os: ubuntu-latest
            node: 24.x
          - os: macos-latest
            node: 22.x
          - os: macos-latest
            node: 24.x
          - os: windows-latest
            node: 22.x
          - os: windows-latest
            node: 24.x

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      - name: Install image-processing test dependencies
        run: python -m pip install --disable-pip-version-check --no-input Pillow numpy

      - name: Run tests
        run: npm test

      - name: Validate plugin manifest and Skill contracts
        run: npm run validate:contracts

      - name: Run visual smoke checks
        if: matrix.node == '24.x'
        run: npm run smoke:visual

      - name: Run Windows visual regression checks
        if: runner.os == 'Windows' && matrix.node == '24.x'
        run: npm run visual:regression

      - name: Verify release metadata
        if: matrix.node == '24.x'
        run: npm run verify:release

      - name: Verify release package
        if: matrix.node == '24.x'
        run: node scripts/build-release.mjs --output-dir dist/release-ci

      - name: Smoke test installed release package
        if: matrix.node == '24.x'
        shell: bash
        run: node scripts/verify-release-archive.mjs "dist/release-ci/museboard-v$(node -p \"require('./package.json').version\").tgz"
